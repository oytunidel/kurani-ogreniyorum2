name: kurani_ogreniyorum
description: Kur'an'ı Öğreniyorum - Diyanet Elif-Bâ metodolojisiyle oyunlaştırılmış Kur'an okuma öğrenme uygulaması.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  speech_to_text: ^6.6.2
  shared_preferences: ^2.3.2
  confetti: ^0.7.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
